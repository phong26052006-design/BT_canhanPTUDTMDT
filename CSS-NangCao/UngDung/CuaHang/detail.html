<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chi tiết phụ kiện · Phong Select</title><link rel="stylesheet" href="../../vendor/bootstrap.min.css"><link rel="stylesheet" href="../../vendor/xzoom.css"><link rel="stylesheet" href="../../vendor/star-rating.min.css"><link rel="stylesheet" href="shop.css"></head>
<body><header class="shop-head"><div class="container shop-nav"><a href="./">← Bộ sưu tập</a><a class="shop-logo" href="./">PHONG SELECT</a><button class="btn btn-default" data-toggle="modal" data-target="#cart">Giỏ hàng <span class="badge" id="cart-count">0</span></button></div></header>
<main class="container"><article id="detail" class="detail-area" hidden><div class="row"><div class="col-md-6"><div class="gallery"><img class="xzoom" id="primary-image" alt=""><div class="xzoom-thumbs" id="thumbs"></div><p class="muted">Rê chuột lên ảnh để phóng to. Có thể chọn hình thu nhỏ bằng bàn phím.</p><button id="large-image" class="btn btn-default" type="button" data-toggle="modal" data-target="#image-dialog">Mở ảnh lớn</button></div></div><div class="col-md-6"><p class="tagline" id="product-category"></p><h1 id="product-name"></h1><div id="detail-rating"></div><p id="product-price"></p><p id="description"></p><div id="stock-box"></div><form id="add-form" class="buy-form"><label for="variant">Phiên bản</label><select id="variant" class="form-control"><option value="Tiêu chuẩn">Tiêu chuẩn</option><option value="Kèm hộp quà">Kèm hộp quà</option></select><label for="quantity">Số lượng</label><input type="number" id="quantity" class="form-control" min="1" value="1" required><button class="btn btn-primary" type="submit">Thêm vào giỏ</button><p id="add-status" role="status"></p></form></div></div><section class="reviews"><h2>Đánh giá sản phẩm</h2><div id="reviews"></div><form id="review-form"><label for="review-score">Chọn số sao</label><input id="review-score" aria-label="Số sao đánh giá" type="number" min="1" max="5" step="1" value="0"><label for="review-text">Nhận xét</label><textarea id="review-text" class="form-control" rows="3" maxlength="300" required></textarea><button class="btn btn-primary">Lưu đánh giá trên máy này</button><p id="review-status" role="status"></p></form></section><section><h2>Phụ kiện khác</h2><div class="row" id="related"></div></section></article><p id="missing" hidden>Không tìm thấy sản phẩm. <a href="./">Quay về danh mục</a>.</p></main>
<footer><div class="container">Phong Select · Dữ liệu sản phẩm và giao dịch mô phỏng <a class="pull-right" href="orders.html">Xem trạng thái đơn →</a></div></footer>
<div class="modal fade" id="image-dialog" tabindex="-1" role="dialog" aria-label="Ảnh sản phẩm"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-body"><button class="close" data-dismiss="modal" aria-label="Đóng">×</button><img id="zoom-dialog-image" alt="Ảnh chi tiết sản phẩm"></div></div></div></div>
<template id="cart-template"><div class="modal fade" id="cart" tabindex="-1" role="dialog" aria-labelledby="cart-title"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><button type="button" class="close" data-dismiss="modal" aria-label="Đóng">×</button><h2 class="modal-title" id="cart-title">Giỏ hàng</h2></div><div class="modal-body"><div id="cart-lines"></div><p id="cart-total"></p><p id="cart-status" role="status"></p></div><div class="modal-footer"><button type="button" class="btn btn-default" data-dismiss="modal">Tiếp tục xem</button><button type="button" class="btn btn-primary" id="order">Tạo đơn mô phỏng</button></div></div></div></div></template>
<script src="../../vendor/jquery-3.7.1.min.js"></script><script src="../../vendor/bootstrap.min.js"></script><script src="../../vendor/xzoom.min.js"></script><script src="../../vendor/star-rating.min.js"></script><script src="catalog.js"></script><script src="shop.js"></script></body></html>
